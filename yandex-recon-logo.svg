<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="YandexRecon logo">
  <defs>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2A2A"/>
      <stop offset="0.55" stop-color="#D3122B"/>
      <stop offset="1" stop-color="#C4162A"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5a1019"/>
      <stop offset="1" stop-color="#1e0609"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2A2A" stop-opacity="0"/>
      <stop offset="1" stop-color="#FF2A2A" stop-opacity="0.55"/>
    </linearGradient>
    <clipPath id="lensClip"><circle cx="128" cy="128" r="72"/></clipPath>
  </defs>

  <rect width="256" height="256" rx="48" fill="#0B0B0E"/>
  <rect x="3" y="3" width="250" height="250" rx="45" fill="none" stroke="#D3122B" stroke-opacity="0.35" stroke-width="2"/>

  <g stroke="#D3122B" stroke-width="9" stroke-linecap="round">
    <line x1="128" y1="24" x2="128" y2="40"/>
    <line x1="128" y1="216" x2="128" y2="232"/>
    <line x1="24" y1="128" x2="40" y2="128"/>
    <line x1="216" y1="128" x2="232" y2="128"/>
  </g>

  <circle cx="128" cy="128" r="80" fill="url(#lens)" stroke="url(#word)" stroke-width="14"/>

  <g clip-path="url(#lensClip)">
    <circle cx="128" cy="128" r="48" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
    <circle cx="128" cy="128" r="24" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
    <line x1="56" y1="128" x2="200" y2="128" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
    <line x1="128" y1="56" x2="128" y2="200" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
    <path d="M128 128 L128 56 A72 72 0 0 1 190.4 92 Z" fill="url(#sweep)"/>
    <line x1="128" y1="128" x2="190.4" y2="92" stroke="#FF8A7A" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <circle cx="161" cy="88" r="7" fill="#FF8A7A"/>
  <circle cx="161" cy="88" r="14" fill="none" stroke="#FF8A7A" stroke-opacity="0.45" stroke-width="2.5"/>
  <circle cx="94" cy="155" r="5" fill="#FF2A2A" fill-opacity="0.75"/>
  <circle cx="162" cy="164" r="3.5" fill="#FF2A2A" fill-opacity="0.5"/>
  <circle cx="128" cy="128" r="5" fill="#ffffff" fill-opacity="0.9"/>
